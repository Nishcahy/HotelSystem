server:
  port: 8085
spring:
  application:
    name: Inventory-service

  # --- MySQL Datasource ---
  datasource:
    url: jdbc:mysql://localhost:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
    username: root
    password: root

#    # HikariCP connection pool (tune as needed)
#    hikari:
#      pool-name: InventoryHikariPool
#      maximum-pool-size: 10
#      minimum-idle: 2
#      idle-timeout: 60000         # 60s
#      connection-timeout: 30000   # 30s
#      validation-timeout: 5000
#      max-lifetime: 1800000       # 30 min
#      leak-detection-threshold: 0

  jpa:
    hibernate:
      ddl-auto: update            # dev-friendly; use 'validate' with migrations in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
        # dialect is auto-detected in Spring Boot 3; uncomment if needed:
        # dialect: org.hibernate.dialect.MySQL8Dialect


  kafka:
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

    properties:
      "spring.deserializer.value.delegate.class": org.springframework.kafka.support.serializer.JsonDeserializer
      "spring.json.trusted.packages": "com.hotelbooking.*"

# Optional logging
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE