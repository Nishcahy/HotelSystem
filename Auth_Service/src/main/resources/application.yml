server:
  port: 8082 # Changed port to 8082

spring:
  application:
    name: Auth_Service

  # --- Database Configuration (MySQL) ---
  datasource:
    url: jdbc:mysql://localhost:3306/users
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA/Hibernate Configuration ---
  jpa:
    hibernate:
      ddl-auto: update # Automatically update schema (dev setting)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# --- Custom JWT/Refresh Token Properties ---
application:
  security:
    jwt:
      # Time in minutes for the short-lived Access Token
      access-token-expiration-minutes: 15
    # Time in days for the long-lived Refresh Token
    refresh-token-expiration-days: 7

# --- RSA Key Pair for JWT Signing ---
# ⚠️ IMPORTANT: Replace these placeholders with your actual Base64 encoded RSA keys.
# These keys are mandatory for Spring Security's JwtEncoder/JwtDecoder beans.
jwt:
  key:
    # Private Key: Used by JwtEncoder (in Auth_Service) to sign the token.
    private-key-base64: 
 
    
    # Public Key: Used by JwtDecoder (in ALL microservices) to verify the token's signature.
    public-key-base64: 
admin:
  initial:
    email: super.admin@hotelbooking.com
    password: SuperAdmin@123